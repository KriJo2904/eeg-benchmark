# Maszyna z aplikacją: baza (Mongo), projects-api i frontend.
# Backend C++ działa natywnie na drugiej maszynie (start-backend.sh).
# Uruchomienie: ./start-aplikacja.sh
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: eeg_workspace
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  projects-api:
    build:
      context: .
      dockerfile: projects-api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/eeg_workspace
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - projects-api
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mongo_data:
