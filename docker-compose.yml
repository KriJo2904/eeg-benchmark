services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      EEG_DATASET_ROOT: /data/eegmmidb
      PROJECTS_API_URL: http://projects-api:3000
    volumes:
      - "./backend/eegmmidb:/data/eegmmidb:ro"
    ports:
      - "8080:8080"
    depends_on:
      - projects-api

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: eeg_workspace
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  projects-api:
    build:
      context: .
      dockerfile: projects-api/Dockerfile
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/eeg_workspace
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
      - projects-api
    ports:
      - "5173:80"

volumes:
  mongo_data:

