# Frontend z Vite (HMR) — zmiany w plikach od razu w przeglądarce, bez `docker compose build`.
#
# Z katalogu głównego repozytorium:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up frontend-dev backend mongo projects-api
#
# Aplikacja: http://localhost:5173
# (Nie uruchamiaj wtedy serwisu `frontend` z nginx — ten jest pod production build.)
services:
  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_BACKEND: http://backend:8080
      VITE_PROXY_PROJECTS: http://projects-api:3000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
      - projects-api

volumes:
  frontend_dev_node_modules:
