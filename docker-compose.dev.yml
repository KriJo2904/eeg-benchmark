services:
  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VITE_PROXY_BACKEND: http://host.docker.internal:8080
      VITE_PROXY_PROJECTS: http://projects-api:3000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - projects-api

volumes:
  frontend_dev_node_modules:
